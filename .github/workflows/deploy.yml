name: Deploy PHYSICS 20 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract game project
        run: unzip -o physics-20-nov-19-2026-12-49-59-pm.zip -d .

      - name: Configure Vite for GitHub Pages
        run: >-
          node -e "const fs=require('fs');const p='vite.config.ts';let s=fs.readFileSync(p,'utf8');if(!s.includes(\"base: '/physics-20/'\")){if(!s.includes('return {'))throw new Error('Could not find Vite config return object');s=s.replace('return {',\"return {\\n    base: '/physics-20/',\",1);fs.writeFileSync(p,s)}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix esbuild dependency version
        run: npm pkg set 'devDependencies.esbuild=^0.28.2'

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
